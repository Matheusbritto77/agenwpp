syntax = "proto3";

package whatsapp;

service WhatsAppBridge {
  // Bidirectional gRPC stream between adminagenda (client) and agenwpp (server)
  rpc ChannelStream (stream BridgeClientMessage) returns (stream BridgeServerMessage);

  rpc SendMessage (SendMessageRequest) returns (SendMessageResponse);
  rpc GetStatus (GetStatusRequest) returns (StatusResponse);
  rpc Connect (ConnectRequest) returns (ConnectResponse);
  rpc Disconnect (DisconnectRequest) returns (DisconnectResponse);
  rpc StreamEvents (Empty) returns (stream WhatsAppEvent);
}

message Empty {}

message BridgeClientMessage {
  string tenant_id = 1;
  string action = 2; // 'ping', 'connect', 'disconnect', 'send_message', 'get_status'
  string payload_json = 3;
}

message BridgeServerMessage {
  string tenant_id = 1;
  string event = 2; // 'pong', 'status', 'qr_ready', 'connected', 'disconnected', 'message_sent', 'message_received'
  string payload_json = 3;
  int64 timestamp = 4;
}

message GetStatusRequest {
  string tenant_id = 1;
}

message ConnectRequest {
  string tenant_id = 1;
}

message ConnectResponse {
  string status = 1;
  string qr_code = 2;
  string message = 3;
}

message DisconnectRequest {
  string tenant_id = 1;
}

message DisconnectResponse {
  string status = 1;
  string message = 2;
}

message SendMessageRequest {
  string tenant_id = 1;
  string to = 2;
  string body = 3;
  string idempotency_key = 4;
}

message SendMessageResponse {
  string message_id = 1;
  string status = 2;
  string error = 3;
}

message StatusResponse {
  string state = 1;
  string phone_number = 2;
  string tenant_id = 3;
  string qr_code = 4;
  string updated_at = 5;
}

message WhatsAppEvent {
  string type = 1;
  string payload_json = 2;
}
